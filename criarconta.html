<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="CSS/style.css" type="text/css">
        <title>ExploraZO - Criar Conta</title>
        <script src="JS/tema.js"></script>
    </head>
    <body>
        <header>
            <img src="imagens/explorazo.png" alt="logo do ExploraZo." width="120px">
            <h1>Explora<span>ZO</span></h1>
            <a href="login.html" id="login"><i class="fa-regular fa-user"></i> Login</a>
        </header>
        <nav>
            <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="orçamento.html"><i class="fa-regular fa-calendar"></i> Orçamento</a>
            <a href="sobre.html"><i class="fa-solid fa-circle-info"></i> Sobre</a>
        </nav>

        <main id="maincriar">
            <img src="imagens/montanha-icon.png" width="130px" height="130px" alt="montanha-icon">
            <section id="principalcriar">
                <h2 style="color: rgb(24, 120, 50);">Crie sua conta para começar a explorar o mundo!</h2><br>

                <form method="GET" action="#" enctype="multipart/form-data">
                    <label for="nome" style="color: #003A1C; font-weight: bold;">Nome:</label>
                    <input type="text" id="nome" class="inputcampo" placeholder="Digite seu nome" required minlength="15" maxlength="60"><br><br>
 
                    <label for="email" style="color: #003A1C; font-weight: bold;">E-mail:</label>
                    <input type="email" id="email" class="inputcampo" placeholder="Digite seu e-mail" required><br><br>

                    <label for="senha" style="color: #003A1C; font-weight: bold;">Senha:</label>
                    <input type="password" id="senha" class="inputcampo" placeholder="Digite sua senha" required minlength="8" maxlength="8"><br><br>

                    <label for="nascimento" style="color: #003A1C; font-weight: bold;">Data de Nascimento:</label>
                    <input type="date" id="nascimento" class="inputcampo" required><br><br>
                    
                    <label for="telefone" style="color: #003A1C; font-weight: bold;">Telefone:</label>
                    <input type="tel" id="telefone" class="inputcampo" placeholder="Digite seu telefone" required minlength="11" maxlength="11"><br><br>

                    <label for="genero" style="color: #003A1C; font-weight: bold;">Gênero:</label>
                    <input type="radio" id="masculino" name="genero" value="masculino" required>
                    <label for="masculino">Masculino</label>
                    <input type="radio" id="feminino" name="genero" value="feminino" required>
                    <label for="feminino">Feminino</label><br><br>
                    

                    <br><input type="checkbox" id="termos" required>
                    <label for="termos">Aceito os termos e condições</label><br><br>
                    <button type="submit">Criar Conta</button><br><br><br>
                </form>
            </section>
        </main>
        <footer style="color: white;">
            <p><h2>Nossos Canais de atendimento</h2>              
            <p id="femail"><i class="fa-regular fa-envelope"></i> contatosexplorazo@gmail.com</p>
            <p id="ftelefone"><i class="fa-solid fa-phone"></i> (21) 93454-2234</p>
            <p><i class="fa-solid fa-location-dot"></i> Rua francisco de campos, 354, Campo Grande.</p><hr>
            <p>&copy; 2026 ExploraZO. Todos os direitos reservados.</p>
        </footer>
    </body>
</html>
