    <head>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="CSS/style.css" type="text/css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <script src="JS/tema.js"></script>

    <body>
        <header>
            <img src="imagens/explorazo.png" alt="logo do ExploraZo." width="120px">
            <h1>Explora<span>ZO</span></h1>
            <a href="login.html" id="login" class="ativo"><i class="fa-regular fa-user"></i> Login</a>

        <nav>

        <main id="loginmain">
            <img src="imagens/montanha-icon.png" width="130px" height="130px" alt="montanha-icon">
            <div>
                <h3 style="color: rgb(24, 120, 50);">Entre na sua conta e aventure-se!</h3><br>

                <form>
                    <label for="email" style="color: #003A1C; font-weight: bold;">E-mail:</label><br>
                    <input type="email" id="email"  class="inputcampo" placeholder="Digite seu e-mail" required><br><br>

                    <label for="senha" style="color: #003A1C; font-weight: bold;">Senha:</label><br>
                    <input type="password" id="senha" class="inputcampo" placeholder="Digite sua senha" required minlength="8" maxlength="8"><br><br>

                    <button type="submit">Entrar</button><br><br>
                </form><br>
                <p class="esquecesenha">
                    <button><i class="fa-solid fa-paper-plane"></i> <a href="recuperar.html" class="botaosemlinha">Esqueci minha senha</a></button><br><br><br>
                </p>
                <p class="cadastro">
                    <span style="color: rgb(24, 120, 50);">Ainda não tem uma conta?</span><br><br>
                    <button><a href="criarconta.html" class="botaosemlinha">Criar conta</a></button>
                </p><br>
                
            </div>
        </main>
